<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Biertan Welcome Screen</title>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=IM+Fell+English+SC&amp;family=UnifrakturCook:wght@700&amp;display=swap">
<style>
body{margin:0;background:#0b0d14}
.menu-item{appearance:none;background:none;border:0;margin:0;cursor:pointer;display:flex;align-items:center;gap:16px;min-height:48px;padding:0 8px;text-align:left;font-family:'IM Fell English','Georgia',serif;font-size:30px;color:#cfc6b3;transition:color .2s,transform .2s}
.menu-item .mk{width:14px;height:14px;opacity:0;transform:translateX(-8px);transition:opacity .2s,transform .2s}
.menu-item:hover,.menu-item:focus-visible{color:#f3ead6;transform:translateX(6px);outline:none}
.menu-item:hover .mk,.menu-item:focus-visible .mk{opacity:1;transform:none}
.menu-item.primary{color:#f3ead6}
.menu-item.primary .mk{opacity:1;transform:none}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(80px)}}
@keyframes flicker{0%,100%{opacity:1}42%{opacity:.75}48%{opacity:1}70%{opacity:.85}}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(-200px,-60px)}50%{transform:translate(-380px,10px)}75%{transform:translate(-190px,70px)}100%{transform:translate(0,0)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.25)}}
.mist{position:absolute;left:-80px;width:1600px;height:240px;background:radial-gradient(ellipse at center,rgba(150,160,175,.32) 0%,rgba(150,160,175,0) 68%);filter:blur(14px);animation:drift 38s ease-in-out infinite alternate}
.win{animation:flicker 4.6s ease-in-out infinite}
.bat{position:absolute;width:56px;height:28px;animation:fly 12s ease-in-out infinite}
.bat svg{width:56px;height:28px;transform-origin:center;animation:flap .3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.mist,.win{animation:none}}
</style>
</helmet>

<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 810px; box-sizing: border-box; padding: 0 96px; display: flex; flex-direction: column; justify-content: center; gap: 14px">
<div style="font-family: 'IM Fell English SC', Georgia, serif; font-size: 16px; letter-spacing: 0.32em; color: #aab3bd">Anno MDXXI · Siebenbürgen</div>
<h1 style="margin: 0; font-family: 'UnifrakturCook', 'IM Fell English', Georgia, serif; font-weight: 700; font-size: 156px; line-height: 1; color: #f3ead6; text-shadow: 0 0 40px rgba(179,55,47,0.45), 0 4px 0 rgba(0,0,0,0.6)">Biertan</h1>
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 90px; height: 1px; background: {{accent}}"></div>
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="{{accent}}"></path></svg>
<div style="font-family: 'IM Fell English', Georgia, serif; font-style: italic; font-size: 24px; color: #aab3bd">A Hunter’s Ballad of Transylvania</div>
</div>
<nav aria-label="Main menu" style="display: flex; flex-direction: column; gap: 2px; margin-top: 26px">
<button class="menu-item primary" type="button"><svg class="mk" aria-hidden="true" viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="{{accent}}"></path></svg>Begin the Hunt</button>
<button class="menu-item" type="button"><svg class="mk" aria-hidden="true" viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="{{accent}}"></path></svg>Continue</button>
<button class="menu-item" type="button"><svg class="mk" aria-hidden="true" viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="{{accent}}"></path></svg>Bestiary</button>
<button class="menu-item" type="button"><svg class="mk" aria-hidden="true" viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="{{accent}}"></path></svg>Settings</button>
<button class="menu-item" type="button"><svg class="mk" aria-hidden="true" viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="{{accent}}"></path></svg>Leave the Valley</button>
</nav>
</div>

<div style="position: absolute; right: 64px; bottom: 40px; font-family: 'IM Fell English', Georgia, serif; font-style: italic; font-size: 20px; color: #aab3bd">Salt for the dead. Silver for what walks.</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b3372f","options":["#b3372f","#8a2a4a","#c4622d","#4f7a6a"]},"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#b3372f' };
}
}
</script>
