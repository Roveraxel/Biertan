name: Fetch village photos

on:
  workflow_dispatch:
  push:
    branches: [godot-level1-slice]
    paths: [tools/fetch_photos.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos from Wikimedia Commons
        run: python3 tools/fetch_photos.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add assets/photos
          git diff --cached --quiet || git commit -m "Add village photos from Wikimedia Commons"
          git push
