[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/photos/*.json"
exclude_filter="tools/*, docs/*, *.html, canvas.json, README.md, .github/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}#rotate{display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:99;background:#0b0d14;color:#f3ead6;font-family:Georgia,serif;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:28px}@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}</style><script>document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='rotate';d.textContent='Turn your phone sideways to play Biertan.';document.body.appendChild(d);});document.addEventListener('contextmenu',function(e){e.preventDefault();});</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
